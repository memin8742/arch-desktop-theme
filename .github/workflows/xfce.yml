name: Xfce installer checks
on:
  push:
    branches: [main, codex/xfce-installer]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arch-x11:
    runs-on: ubuntu-latest
    container: archlinux:base
    timeout-minutes: 15
    steps:
      - name: Prepare official Arch packages
        run: >-
          pacman -Syu --noconfirm --needed git python python-gobject vte3 zsh
          zsh-syntax-highlighting zsh-autosuggestions ttf-fira-code picom xclip wmctrl
          xorg-xprop xorg-xrandr xdotool libnotify xfce4-screensaver xfce4-screenshooter
          xfce4-whiskermenu-plugin xfce4-pulseaudio-plugin xfce4-power-manager
          copyq papirus-icon-theme fastfetch grc tree xfwm4 xfconf xfce4-panel
          xfdesktop thunar xfce4-settings xorg-server-xvfb xorg-xauth xorg-xwininfo dbus sudo
          ffmpeg xfce4-notifyd xcape xdg-user-dirs
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Source and package checks
        run: |
          bash -n kur.sh
          bash -n installer/boot/refresh.sh
          zsh -n installer/theme.zsh
          python -m compileall -q installer tools
          python -m unittest discover -s installer -p 'test_installer.py' -v
          python tools/package.py check
      - name: Non-root Arch / Xfwm / GTK / VTE integration
        run: |
          useradd -m tester
          chmod -R a+rX .
          sudo -u tester env GITHUB_ACTIONS=true XDG_CURRENT_DESKTOP=XFCE XDG_SESSION_TYPE=x11 \
            dbus-run-session -- xvfb-run -a python installer/linux_smoke.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: xfce-test-desktop
          path: /tmp/arch-theme-ci.png
